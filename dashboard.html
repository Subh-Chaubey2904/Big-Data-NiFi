<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Apache NiFi Presentation</title>
    <meta name="description" content="Presentation dashboard showing all 12 slides of the Apache NiFi interactive presentation.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-wrapper">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a class="nav-brand" href="dashboard.html">
                    <span class="brand-icon"><i class="bi bi-diagram-3-fill"></i></span>
                    Apache NiFi
                </a>
                <div class="nav-links d-none d-md-flex gap-1">
                    <a href="dashboard.html" class="active"><i class="bi bi-grid-3x3-gap me-1"></i>Presentation</a>
                    <a href="slide.html?id=1"><i class="bi bi-play-circle me-1"></i>Slides</a>
                    <a href="demo.html"><i class="bi bi-rocket-takeoff me-1"></i>Demo</a>
                </div>
                <div class="nav-status d-none d-sm-flex">
                    <span class="dot"></span>
                    Interactive Presentation
                </div>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="dashboard-page">
        <div class="container">

            <!-- Header -->
            <div class="dash-header">
                <h1>Apache NiFi</h1>
                <p class="sub">Data Integration &amp; Flow Automation</p>
                <div class="stats glass">
                    <span><i class="bi bi-collection me-1"></i>12 Slides</span>
                    <span><i class="bi bi-people me-1"></i>6 Presenters</span>
                    <span><i class="bi bi-hand-index me-1"></i>Interactive Presentation</span>
                </div>
            </div>

            <!-- Slides Grid -->
            <div class="slides-grid">
                <div class="row" id="slides-grid">
                    <!-- Rendered by JavaScript -->
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <p class="footer-brand">Apache NiFi Interactive Presentation</p>
            <p>Data Integration &amp; Flow Automation &bull; Academic Presentation</p>
        </footer>
    </div>

    <!-- JS -->
    <script src="js/slides.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();
            renderDashboard();
            initScrollNav();
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
