<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide — Apache NiFi Presentation</title>
    <meta name="description" content="Interactive slide view for the Apache NiFi academic presentation.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-wrapper">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- Slide Page -->
    <div class="slide-page">

        <!-- Top Bar -->
        <div class="slide-topbar">
            <div class="container d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="back-btn">
                    <i class="bi bi-arrow-left"></i> Back to Slides
                </a>
                <div class="slide-info" id="slide-info">
                    <strong>Loading...</strong>
                </div>
                <div class="nav-status d-none d-sm-flex">
                    <span class="dot"></span>
                    Live
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="slide-content-wrapper">
            <div class="slide-content container" id="slide-content">
                <!-- Dynamically rendered -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="slide-bottombar">
            <div class="container d-flex justify-content-between align-items-center">
                <button class="slide-nav-btn" id="btn-prev" aria-label="Previous slide">
                    <i class="bi bi-arrow-left"></i> Previous
                </button>
                <div class="progress-dots" id="progress-dots" role="navigation" aria-label="Slide progress">
                    <!-- Rendered by JS -->
                </div>
                <button class="slide-nav-btn" id="btn-next" aria-label="Next slide">
                    Next <i class="bi bi-arrow-right"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- ═══════════════════════════════════════════════════
         QUIZ VIDEO MODAL
         This modal is shown when a quiz answer is clicked.
         The video source is set dynamically from QUIZ_VIDEOS.
         ═══════════════════════════════════════════════════ -->
    <div class="quiz-video-modal" id="quiz-video-modal">
        <div class="quiz-modal-backdrop" onclick="closeQuizVideoModal()"></div>
        <div class="quiz-modal-card">
            <button class="quiz-modal-close" onclick="closeQuizVideoModal()" aria-label="Close video">&times;</button>
            <div style="text-align:center;">
                <div class="quiz-modal-label">🎬 VIDEO</div>
            </div>
            <div class="quiz-modal-video-wrap">
                <!--
                    ═══════════════════════════════════════════
                    VIDEO PLACEHOLDER
                    ═══════════════════════════════════════════
                    The src is set dynamically from the QUIZ_VIDEOS
                    config object in slides.js.

                    To add your videos, edit the QUIZ_VIDEOS object
                    at the top of js/slides.js:

                    const QUIZ_VIDEOS = {
                        correct1: "assets/videos/correct1.mp4",
                        wrong1:   "assets/videos/wrong1.mp4",
                        correct2: "assets/videos/correct2.mp4",
                        wrong2:   "assets/videos/wrong2.mp4",
                        correct3: "assets/videos/correct3.mp4",
                        wrong3:   "assets/videos/wrong3.mp4"
                    };

                    <!-- CORRECT_VIDEO_1 -->
                    <!-- WRONG_VIDEO_1 -->
                    <!-- CORRECT_VIDEO_2 -->
                    <!-- WRONG_VIDEO_2 -->
                    <!-- CORRECT_VIDEO_3 -->
                    <!-- WRONG_VIDEO_3 -->
                    ═══════════════════════════════════════════
                -->
                <video controls preload="metadata">
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="js/slides.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();
            const slideId = getCurrentSlideId();
            renderSlide(slideId);
            initSlideNavigation();

            // Initialize quiz engine when on the quiz slide
            if (slideId === 13) {
                initQuiz();
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
