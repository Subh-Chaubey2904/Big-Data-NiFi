<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache NiFi — Interactive Data Flow Presentation</title>
    <meta name="description" content="Interactive academic presentation on Apache NiFi — Data Integration and Flow Automation. Explore data flows, processors, and real-time pipeline demonstrations.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-wrapper">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- Login Page -->
    <div class="login-page">
        <div class="login-card glass glass-strong">

            <!-- Logo -->
            <div class="login-logo">
                <i class="bi bi-diagram-3-fill"></i>
            </div>

            <h1>Apache NiFi</h1>
            <p class="subtitle">Interactive Data Flow Presentation</p>

            <!-- Login Form -->
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control-glass" placeholder="Enter username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control-glass" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-nifi" id="login-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Enter Presentation
                </button>

                <!-- Error Message -->
                <div class="login-error" id="login-error">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    Invalid demo credentials. Please try again.
                </div>

                <!-- Demo Credentials -->
                <div class="demo-creds glass">
                    <div class="label">Demo Credentials</div>
                    <div>
                        <code>admin</code> &nbsp;/&nbsp; <code>nifi123</code>
                    </div>
                </div>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer" style="position:fixed;bottom:0;left:0;right:0;">
        <p class="footer-brand">Apache NiFi Interactive Presentation</p>
        <p>Data Integration &amp; Flow Automation &bull; Academic Presentation</p>
    </footer>

    <!-- JS -->
    <script src="js/main.js"></script>
    <script>
        // Initialize login
        document.addEventListener('DOMContentLoaded', initLogin);
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
